# CI (step G.5). Runs on every pull request and on pushes to main and develop.
# The job name "check" is the required status check for branch protection (G.6).
# Every action is pinned to a commit SHA (tag in the comment). Versions and
# vetting are recorded in SKILLS.md Appendix A.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_COMMIT_VERSION: "4.7.0"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official release
  # gitleaks_8.30.1_checksums.txt (matches the GitHub release asset digest).
  # Update together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pre-commit (pinned)
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Pre-commit hooks on all files
        # gitleaks is run on the full history in the next step (its hook only
        # scans staged changes). no-commit-to-branch only applies to local commits.
        env:
          SKIP: gitleaks,no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Secret scan of the full git history (gitleaks, pinned SHA-256)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          (cd "$RUNNER_TEMP" && echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - name: Check command (placeholder until T.24 / F1.2 / O1.4)
        # TODO(T.24 / F1.2 / O1.4): replace this step with: npm run check
        # G.5 stays unticked in TASKS.md until the real check command runs here.
        run: |
          echo "::warning title=Placeholder::The single check command (npm run check) does not exist yet. It is added in T.24 / F1.2 / O1.4."
          echo "Placeholder only: no lint, type check, tests or build ran in this step."
