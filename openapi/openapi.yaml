        qty_short:
          $ref: '#/components/schemas/Quantity'
        qty_rejected:
          $ref: '#/components/schemas/Quantity'
        qty_resolved:
          $ref: '#/components/schemas/Quantity'
        qty_unresolved:
          $ref: '#/components/schemas/Quantity'
        note:
          type: string
          description: The receiver's note or rejection reason.
        flagged_by:
          $ref: '#/components/schemas/UserRef'
        flagged_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/DiscrepancyResolution'
        allowed_actions:
          type: array
