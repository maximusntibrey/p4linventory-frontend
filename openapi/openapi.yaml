# OpenAPI 3.1 contract for Sprints 1-2 (B1.3). Source of truth for the frontend; see openapi/README.md.
openapi: 3.1.0
info:
  title: Payless4Laptops Inventory & Warehouse API
  version: 0.2.0
  summary: Sprints 1-2 contract (MVP)
  description: 'Contract for Sprints 1 and 2 (the MVP) of the Payless4Laptops Inventory & Warehouse System. Contract-first:
    the backend implements against this file; the frontend generates its typed client and mock responses from it.


    Conventions

    - URLs are /api/v1/<plural-noun>/. Auth is a server-side session cookie plus the CSRF header on unsafe methods.

    - Every list is paginated (DRF envelope) except the bounded lists marked x-unpaginated.

    - One error format (Error) for every failure status; messages are plain and name the field at fault.

    - Money is a string with 2 decimals (GHS). Quantities are strings with 3 decimals. Timestamps are UTC.

    - Every stock-changing POST requires an Idempotency-Key header (UUID).

    - Cost (average_cost, unit_cost) is serialised only for super_admin and warehouse_admin. For the other roles
    the property is absent, not null. Every such property carries x-visible-to.

    - Every operation carries x-action-id (PERMISSIONS.md action IDs), x-roles (roles that may ever call it) and
    x-conditions (the matrix conditions per role). A caller outside the scope of a record gets 404, a caller not
    allowed the action gets 403.

    - No endpoints exist, by design, for ledger.modify, audit.modify or stock.edit_balance_directly (PERMISSIONS
    rows 53-55), nor for role switching and branch access requests (Sprint 5), transfers, adjustments, reports,
    exports or the website API (later sprints).


    Decisions taken (sources): ids in URLs are the internal integers, public references are body fields (ERD E2).
    CSRF: GET /auth/session/ sets the csrftoken cookie, unsafe requests echo it in X-CSRFToken (BE s11). Pagination:
    page and page_size, default 25, max 100, DRF envelope (OVR s3). Error shape and status policy: 400 field errors,
    401, 403 role or caller rule, 404 out-of-scope record, 409 state conflict including insufficient stock, 429
    login lock (OVR s3; PERMISSIONS s8). Login failures use one generic message (P18; BE s11). Brand and sub-type
    choices come with the field definitions as integer ids (E20); the item list brand filter takes the brand name.
    The receiving body is derived from ERD s3.6. IP address and device are shown to Super Admin only (SKILLS:226).
    Dashboard shell and stats follow FE 4.2:51 and BE s8:271 (P12). Duplicate warnings are non-blocking (BE s3.9).
    Sales list defaults to the active branch. A replay of an idempotent request returns the original status code
    plus the header Idempotent-Replayed: true (ERD s8). Menu keys follow FE s3. Image size limit 5 MB. Owner decision
    2026-11-19 (OQ-23): a server-generated one-time password is shown once when a Super Admin creates or resets
    a user; until the user changes it (POST /auth/change-password/), every endpoint except change-password, logout
    and me answers 403 with error code password_change_required; reorder level is set by SA and WA and in the CSV
    opening-stock import; the import requires unit_cost per row (feeds the average cost; cost shown to SA and WA
    only).


    x-open lists items decided later (status later).


    Source of truth: docs/PERMISSIONS.md and docs/ERD.md (approved 2026-11-19). Changing this file after B1.3 merges
    is a contract change: propose, agree with the owner, update, then both sides adjust; breaking changes only at
    a sprint boundary.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /
  description: Same origin as the frontend; paths include /api/v1.
security:
- sessionCookie: []
tags:
- name: System
- name: Auth
- name: Context
- name: Branches
- name: Users
- name: Items
- name: Stock
- name: Prices
- name: Find
- name: Warehouse
- name: Dispatches
- name: Discrepancies
- name: Sales
- name: Dashboard
- name: Activity
- name: Imports
paths:
  /health/:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Liveness and database check
      description: For the uptime monitor and smoke tests. Unauthenticated, outside /api/v1/, returns a plain word
        and never any version, setting or error text.
      x-action-id: []
      x-public: true
      security: []
      responses:
        '200':
          description: 'Plain text: ok.'
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: 'Database unavailable. Plain text: unavailable.'
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/session/:
    get:
      tags:
      - Auth
      operationId: getSession
      summary: Session probe; sets the CSRF cookie
      description: Call once at start-up. Returns whether a valid session exists and sets the csrftoken cookie that
        unsafe requests must echo in X-CSRFToken.
      x-action-id: []
      x-public: true
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
  /api/v1/auth/login/:
    post:
      tags:
      - Auth
      operationId: login
      summary: Log in with login ID and password
      description: Active accounts only. Rate limited (5 failures per login ID plus IP per 15 minutes, then a 15
        minute lock); every attempt is logged. Wrong credentials and inactive accounts both return 401 with one
        generic message.
      x-action-id:
      - auth.login
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
      - csrfToken: []
      responses:
        '200':
          description: Signed in. The session cookie is set and the session key rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Wrong login ID or password, or the account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_credentials
                message: The ID or password is not right.
                errors: []
                request_id: 0b2e5a8c-3f77-4c1f-9a43-7a2b6f1d9e10
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/logout/:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Log out
      x-action-id:
      - auth.logout
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Signed out; the session is destroyed (audited).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me/:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: Current user, role, active branch, allowed actions and menu
      description: The frontend builds its menus and buttons from allowed_actions and menu; nothing is hard-coded.
      x-action-id:
      - auth.me
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/change-password/:
    post:
      tags:
      - Auth
      operationId: changePassword
      summary: Change my own password
      description: Own account only, every role (OQ-23). Allowed while a one-time password is still unchanged (it
        is one of the three endpoints that stay open, with logout and me). Audited.
      x-action-id:
      - auth.change_password
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/context/branches/:
    get:
      tags:
      - Context
      operationId: listSelectableBranches
      summary: Branches the caller may work in
      description: 'Front Staff: every active branch (branches only, not the warehouse). Warehouse Admin and Branch
        Admin: their one permanent location. Super Admin: every active location including the warehouse.'
      x-action-id:
      - context.list_selectable
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      x-conditions:
        context.list_selectable:
          warehouse_admin:
          - own_location
          branch_admin:
          - own_branch
          front_staff:
          - any_active_branch
      x-unpaginated: true
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchRef'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/context/active-branch/:
    put:
      tags:
      - Context
      operationId: setActiveBranch
      summary: Select or switch the working branch
      description: First choice after login is a selection, later calls are switches; each switch is audited (branch.switched).
        Only the caller's own selectable branches are accepted; the client's branch is never trusted for anything
        else. Temporary access to other branches is Sprint 5 and is refused.
      x-action-id:
      - context.select_branch
      - context.switch_branch
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      x-conditions:
        context.select_branch:
          warehouse_admin:
          - own_location
          branch_admin:
          - own_branch
          front_staff:
          - any_active_branch
        context.switch_branch:
          warehouse_admin:
          - own_location
          branch_admin:
          - own_branch
          front_staff:
          - any_active_branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  $ref: '#/components/schemas/Id'
              required:
              - branch
              additionalProperties: false
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: The new context, with the allowed actions and menu for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/branches/:
    get:
      tags:
      - Branches
      operationId: listBranches
      summary: List branches
      description: 'Super Admin: all, with contact details. Warehouse Admin and Front Staff: active branches (id,
        name). Branch Admin: the own branch only.'
      x-action-id:
      - branch.list
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      x-conditions:
        branch.list:
          warehouse_admin:
          - active_id_name_only
          branch_admin:
          - own_branch
          front_staff:
          - active_id_name_only
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/BranchStatus'
        description: Super Admin only; other roles always get active branches.
      - name: kind
        in: query
        schema:
          $ref: '#/components/schemas/BranchKind'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Branches
      operationId: createBranch
      summary: Create a branch
      x-action-id:
      - branch.create
      x-roles:
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/branches/{branch_id}/:
    patch:
      tags:
      - Branches
      operationId: updateBranch
      summary: Edit a branch
      x-action-id:
      - branch.edit
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/branches/{branch_id}/status/:
    post:
      tags:
      - Branches
      operationId: setBranchStatus
      summary: Deactivate or reactivate a branch
      description: Deactivated branches cannot be selected or sold from; their history stays.
      x-action-id:
      - branch.deactivate
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchStatusChange'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: List users
      x-action-id:
      - user.list
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        schema:
          type: string
        description: Name or login ID.
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: branch
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Create a user
      x-action-id:
      - user.create
      x-roles:
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Created. login_id is the generated, immutable ID, and one_time_password is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{user_id}/:
    get:
      tags:
      - Users
      operationId: getUser
      summary: View a user
      x-action-id:
      - user.read
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/UserId'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Edit a user
      x-action-id:
      - user.edit
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/role/:
    put:
      tags:
      - Users
      operationId: setUserRole
      summary: Assign or change the role
      description: Super Admin only; a user cannot change their own role. The login ID prefix never changes (E8).
      x-action-id:
      - user.assign_role
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleChange'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/status/:
    post:
      tags:
      - Users
      operationId: setUserStatus
      summary: Activate, suspend or deactivate a user
      x-action-id:
      - user.set_status
      x-roles:
      - super_admin
      x-conditions:
        user.set_status:
          super_admin:
          - not_self_target
          - not_last_active_sa
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChange'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/reset-password/:
    post:
      tags:
      - Users
      operationId: resetUserPassword
      summary: Reset a user's password
      x-action-id:
      - user.reset_password
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/UserId'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Password replaced by a new one-time password, shown once (audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimePassword'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/permission-grants/{permission}/:
    put:
      tags:
      - Users
      operationId: setPermissionGrant
      summary: Grant or revoke a per-person permission
      description: Each grant and revoke is audited with the granter; history is kept. A grant never widens branch
        scope.
      x-action-id:
      - user.grant_permission
      x-roles:
      - super_admin
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PermissionCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantChange'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/items/:
    get:
      tags:
      - Items
      operationId: listItems
      summary: List items
      description: Branch Admin and Front Staff see Active items and Discontinued items that still hold stock at
        their location, never Draft (P4). average_cost is present only for Super Admin and Warehouse Admin.
      x-action-id:
      - item.read
      x-roles:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      x-conditions:
        item.read:
          branch_admin:
          - active_or_discontinued_with_stock
          front_staff:
          - active_or_discontinued_with_stock
      x-field-action-id:
      - field.cost.read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        schema:
          type: string
        description: Search name, SKU, brand or model.
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/Category'
      - name: brand
        in: query
        schema:
          type: string
        description: Brand name (open question C10).
      - name: condition
        in: query
        schema:
          $ref: '#/components/schemas/Condition'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ItemStatus'
      - name: ordering
        in: query
        schema:
          type: string
          enum:
          - name
          - -name
          - sku
          - -sku
          - -created_at
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Items
      operationId: createItem
      summary: Create an item (Draft)
      x-action-id:
      - item.create
      x-roles:
      - super_admin
      - warehouse_admin
