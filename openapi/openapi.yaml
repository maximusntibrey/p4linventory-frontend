components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Server-side session cookie (HttpOnly, Secure). Obtained by POST /api/v1/auth/login/.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Required on every POST, PUT, PATCH and DELETE (including login). Send the value of the csrftoken
        cookie; GET /api/v1/auth/session/ sets it.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'UUID chosen by the client for this one submission. Same key and same body replays the original
        result (original status code plus header Idempotent-Replayed: true) without any new stock movement; same
        key with a different body returns 409. Scope: caller plus operation, kept forever.'
      schema:
        type: string
        format: uuid
    BranchId:
      name: branch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    GoodsReceiptId:
      name: receipt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DispatchId:
      name: dispatch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DiscrepancyId:
      name: discrepancy_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SaleId:
      name: sale_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PermissionCodePath:
      name: permission
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PermissionCode'
  headers:
    IdempotentReplayed:
      description: 'true when the response is the stored original of an earlier request with the same Idempotency-Key
        and body: same status code and body, no new stock movement.'
      schema:
        type: string
        enum:
        - 'true'
  responses:
    ValidationError:
      description: The request is invalid (a value is missing, malformed or out of range). errors names every field
        at fault. A well-formed request that fails because of current state, such as insufficient stock, is 409,
        not 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: Please correct the highlighted fields.
            errors:
            - field: lines[0].quantity
              code: invalid_quantity
              message: Enter a quantity greater than zero.
            request_id: 0b2e5a8c-3f77-4c1f-9a43-7a2b6f1d9e10
    Unauthenticated:
      description: Not signed in, or the session expired. The frontend sends the user to login with a clear message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_authenticated
            message: Please sign in to continue.
            errors: []
            request_id: 0b2e5a8c-3f77-4c1f-9a43-7a2b6f1d9e10
    Forbidden:
      description: Signed in, but this action is not allowed for the caller's role, per-person permission or a caller-specific
        rule (not_self, not_receiver, not_self_target, not_last_active_sa). ALSO returned, with error code password_change_required,
        by every endpoint except change-password, logout and me while the caller still has an unchanged one-time
        password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            permission_denied:
              summary: Not allowed
              value:
                code: permission_denied
                message: You are not allowed to do that.
                errors: []
            password_change_required:
              summary: One-time password not changed yet
              value:
                code: password_change_required
                message: Please choose a new password before you continue.
                errors: []
    NotFound:
      description: No such record, or it is outside the caller's scope (another branch, not their own sale, ...).
        The existence of out-of-scope records is not revealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: We could not find that.
            errors: []
            request_id: 0b2e5a8c-3f77-4c1f-9a43-7a2b6f1d9e10
    Conflict:
      description: 'The request is well formed but conflicts with the current state. The ONE status for: insufficient
        stock (sale, dispatch), a resolution larger than the unresolved quantity, already decided, already cancelled,
        or an Idempotency-Key reused with a different body. errors names the field at fault.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_stock:
              summary: Oversell or insufficient stock
              value:
                code: conflict
                message: That quantity is more than the stock at this branch.
                errors:
                - field: lines[0].quantity
                  code: insufficient_stock
                  message: Only 3 available at this branch.
            already_decided:
              summary: State conflict
              value:
                code: conflict
                message: This dispatch has already been received.
                errors:
                - field: non_field
                  code: already_decided
                  message: This dispatch has already been received.
    RateLimited:
      description: Too many failed login attempts (5 per login ID plus IP per 15 minutes, then a 15 minute lock,
        P18).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many attempts. Try again in 15 minutes.
            errors: []
  schemas:
    Id:
      type: integer
      description: Internal numeric identifier (ERD E2). Used in URLs; public references are separate fields.
      format: int64
      minimum: 1
    Money:
      type: string
      description: 'Money in GHS: a decimal string with exactly 2 decimal places, never a JSON number. Example:
        "1250.00".'
      pattern: ^\d{1,10}\.\d{2}$
      example: '1250.00'
    Quantity:
      type: string
      description: 'A quantity, numeric(12,3), as a decimal string with exactly 3 decimal places. Whole numbers
        unless the item''s unit of measure allows decimals. Example: "12.000".'
      pattern: ^\d{1,9}\.\d{3}$
      example: '12.000'
    QuantityInput:
      type: string
      description: 'A quantity sent by the client: a decimal string with up to 3 decimal places, strictly greater
        than zero (the pattern rejects 0, 0.0 and 0.000). Example: "5" or "2.500".'
      pattern: ^(?!0+(\.0+)?$)\d{1,9}(\.\d{1,3})?$
      example: '5'
    QuantityInputOrZero:
      type: string
      description: 'A quantity sent by the client where zero is valid (a received or accepted count): a decimal
        string with up to 3 decimal places, not negative.'
      pattern: ^\d{1,9}(\.\d{1,3})?$
      example: '0'
    Timestamp:
      type: string
      description: UTC timestamp in RFC 3339 form ending in Z. The frontend displays it in Africa/Accra (ERD E14).
      format: date-time
      example: '2026-11-19T09:30:00Z'
    LoginId:
      type: string
      description: 'Immutable, never-reused login ID: SA-0001 style for Super Admins, USR-0001 style for everyone
        else.'
      pattern: ^(SA|USR)-\d{4,}$
      example: USR-0007
    RoleCode:
      type: string
      enum:
      - super_admin
      - warehouse_admin
      - branch_admin
      - front_staff
      description: 'Role. Sprints 1-2: exactly one role per user (multi-role is Sprint 5).'
    PermissionCode:
      type: string
      enum:
      - receive_stock
      - manage_prices
      - apply_discount
      description: Per-person permission granted by a Super Admin. apply_discount is grantable now but enforced
        from Sprint 6.
    ActionId:
      type: string
      enum:
      - auth.login
      - auth.logout
      - auth.me
      - context.list_selectable
      - context.select_branch
      - context.switch_branch
      - branch.list
      - branch.create
      - branch.edit
      - branch.deactivate
      - user.list
      - user.read
      - user.create
      - user.edit
      - user.assign_role
      - user.set_status
      - user.reset_password
      - user.grant_permission
      - dashboard.shell
      - dashboard.stats
      - activity.list
      - item.read
      - item.field_definitions
      - item.create
      - item.edit
      - item.activate
      - item.discontinue
      - item.upload_image
      - price.read
      - price.set
      - stock.list_own_location
      - stock.list_other_locations
      - find.search
      - stock.lookup_other_branches
      - grn.create
      - grn.read
      - dispatch.create
      - dispatch.list_sent
      - dispatch.list_incoming
      - dispatch.read
      - dispatch.receive
      - discrepancy.read
      - discrepancy.resolve_return
      - discrepancy.resolve_loss
      - discrepancy.resolve_damage
      - sale.create
      - sale.list
      - sale.read
      - sale.cancel
      - import.dry_run
      - import.commit
      - auth.change_password
      - stock.set_reorder_level
      description: 'A PERMISSIONS.md action ID. ledger.modify, audit.modify and stock.edit_balance_directly never
        appear: no endpoint exists for them.'
    Category:
      type: string
      enum:
      - laptop
      - laptop_part
      - accessory
    Condition:
      type: string
      enum:
      - new
      - refurbished
      - used
    ItemStatus:
      type: string
      enum:
      - draft
      - active
      - discontinued
    UserStatus:
      type: string
      enum:
      - pending
      - active
      - suspended
      - deactivated
      description: Only active users can log in.
    BranchKind:
      type: string
      enum:
      - warehouse
      - branch
      description: Exactly one warehouse exists (ERD E1).
    BranchStatus:
      type: string
      enum:
      - active
      - inactive
    DispatchStatus:
      type: string
      enum:
      - in_transit
      - partially_received
      - completed
      - rejected
      - under_investigation
      description: Derived from the line statuses by the ordered rule in ERD E21.
    DispatchLineStatus:
      type: string
      enum:
      - in_transit
      - received
      - under_investigation
      - resolved_returned
      - resolved_lost
      - resolved_damaged
      - resolved_mixed
    DiscrepancyStatus:
      type: string
      enum:
      - open
      - resolved
    ResolutionOutcome:
      type: string
      enum:
      - return
      - loss
      - damage
    SaleStatus:
      type: string
      enum:
      - completed
      - cancelled
      - refunded
      - exchanged
      description: Sprints 1-2 use completed and cancelled only; the other two are Sprint 7.
    MenuKey:
      type: string
      enum:
      - home
      - sell
      - find
      - stock
      - receive
      - items
      - receive_stock
      - dispatch
      - warehouse
      - branches
      - users
      description: Menu entries from FE s3. The frontend maps a key to its route and icon.
    ErrorDetail:
      type: object
      description: One problem found in the request.
      properties:
        field:
          type: string
          description: Name of the field at fault, in request-body or query form (for example lines[0].quantity).
            The value non_field is used when no single field is at fault.
        code:
          type: string
          description: Stable machine-readable code (for example insufficient_stock).
        message:
          type: string
          description: Plain-language message shown to the user as it is.
      required:
      - field
      - code
      - message
    Error:
      type: object
      description: The one error format used by every endpoint, for every failure status.
      properties:
        code:
          type: string
          description: Stable machine-readable code for the whole failure (validation_error, not_authenticated,
            permission_denied, not_found, conflict, rate_limited, ...).
        message:
          type: string
          description: 'Plain-language summary, for example: That quantity is more than the stock at this branch.'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Every field-level problem; empty when none.
        request_id:
          type: string
          description: Correlates with the server log and Sentry.
          format: uuid
      required:
      - code
      - message
      - errors
    PageEnvelope:
      type: object
      description: Pagination envelope shared by every paginated list. Each list schema is this envelope plus a
        typed results array.
      properties:
        count:
          type: integer
          description: Total number of rows across all pages.
          minimum: 0
        next:
          oneOf:
          - type: string
            format: uri-reference
            description: Link to the next page, or null.
          - type: 'null'
        previous:
          oneOf:
          - type: string
            format: uri-reference
            description: Link to the previous page, or null.
          - type: 'null'
      required:
      - count
      - next
      - previous
    BranchRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          description: Public branch ID, e.g. BR-001.
        name:
          type: string
        kind:
          $ref: '#/components/schemas/BranchKind'
      required:
      - id
      - code
      - name
      - kind
    UserRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        login_id:
          $ref: '#/components/schemas/LoginId'
        full_name:
          type: string
      required:
      - id
      - login_id
      - full_name
    ItemRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        name:
          type: string
      required:
      - id
      - sku
      - name
    SessionState:
      type: object
      description: Session probe. Calling it also sets the csrftoken cookie.
      properties:
        authenticated:
          type: boolean
        needs_branch_selection:
          type: boolean
          description: True when signed in but no active branch is chosen yet (Front Staff after login; a Super
            Admin before choosing).
      required:
      - authenticated
      - needs_branch_selection
    LoginRequest:
      type: object
      properties:
        login_id:
          $ref: '#/components/schemas/LoginId'
        password:
          type: string
          format: password
      required:
      - login_id
      - password
      additionalProperties: false
    MenuItem:
      type: object
      description: 'One entry of the role''s menu, at most 5 per role (FE s3). Entries opened from Home (activity
        log, import) are not menu items: they are action IDs in allowed_actions.'
      properties:
        key:
          $ref: '#/components/schemas/MenuKey'
        label:
          type: string
          description: Plain text label shown beside the icon.
        required_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionId'
          description: The user holds at least one of these actions in the current context.
      required:
      - key
      - label
      - required_actions
    Me:
      type: object
      description: The signed-in user, the role and active branch in use, and what they may do. Returned by login,
        me and the branch-switch call.
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        phone:
          type: string
        email:
          oneOf:
          - type: string
          - type: 'null'
        role:
          $ref: '#/components/schemas/RoleCode'
        must_change_password:
          type: boolean
          description: True while a one-time password has not been changed. Every endpoint except change-password,
            logout and me then answers 403 password_change_required.
        permanent_branch:
          oneOf:
          - $ref: '#/components/schemas/BranchRef'
          - type: 'null'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
          description: Active per-person grants.
        active_branch:
          oneOf:
          - $ref: '#/components/schemas/BranchRef'
          - type: 'null'
        needs_branch_selection:
          type: boolean
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionId'
          description: Every action the caller may perform in the current context (role, active branch, per-person
            grants). The frontend builds menus and buttons from this; the server re-checks every call.
        menu:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
          maxItems: 5
      required:
      - user
      - phone
      - email
      - role
      - must_change_password
      - permanent_branch
      - permissions
      - active_branch
      - needs_branch_selection
      - allowed_actions
      - menu
    Branch:
      type: object
      description: 'A location: the warehouse or a branch. Super Admin sees every field; other roles see only id,
        code, name, kind and status (location, contact and audit fields are absent).'
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/BranchKind'
        status:
          $ref: '#/components/schemas/BranchStatus'
        location:
          type: string
          description: Address text.
          x-visible-to:
          - super_admin
        contact:
          type: string
          description: Phone or contact name.
          x-visible-to:
          - super_admin
        created_at:
          $ref: '#/components/schemas/Timestamp'
          x-visible-to:
          - super_admin
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          x-visible-to:
          - super_admin
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionId'
      required:
      - id
      - code
      - name
      - kind
      - status
      - allowed_actions
    BranchCreate:
      type: object
