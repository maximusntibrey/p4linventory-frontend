          application/json:
            schema:
              $ref: '#/components/schemas/DispatchReceive'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Decision recorded; accepted quantities credited to the destination. Replays return the same
            result.
          content:
