      allOf:
      - $ref: '#/components/schemas/PageEnvelope'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/DispatchSummary'
        required:
        - results
    DispatchReceiveLine:
      type: object
      description: Quantity that physically arrived (0 to dispatched; no overage, E3) and the quantity accepted
        (0 to received). For reject, quantity_accepted must be 0 or omitted.
      properties:
        line_id:
          $ref: '#/components/schemas/Id'
        quantity_received:
          $ref: '#/components/schemas/QuantityInputOrZero'
        quantity_accepted:
          $ref: '#/components/schemas/QuantityInputOrZero'
      required:
      - line_id
      - quantity_received
      additionalProperties: false
    DispatchReceive:
      type: object
      description: The receiving decision, recorded once per dispatch, by someone other than the dispatcher. Only
        accepted quantities are credited; any unaccepted remainder stays reserved at the sender and is flagged as
        a discrepancy (Under investigation).
      properties:
        decision:
          type: string
          enum:
          - approve_all
          - approve_partial
          - reject
        note:
          type: string
          description: Required for approve_partial (note) and reject (reason).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DispatchReceiveLine'
          description: Required for approve_partial and reject and must cover every line; omitted for approve_all
            (received = accepted = dispatched).
      required:
      - decision
      additionalProperties: false
      allOf:
      - if:
          properties:
            decision:
              const: approve_all
          required:
          - decision
        then:
          not:
            anyOf:
            - required:
              - lines
            - required:
              - note
      - if:
          properties:
            decision:
              enum:
              - approve_partial
              - reject
          required:
          - decision
        then:
          required:
          - note
          - lines
    DiscrepancyResolution:
      type: object
