      description: At the dispatch's destination, by Super Admin, Branch Admin or Front Staff holding receive_stock;
        never by the user who dispatched it (not_self, no Super Admin exception). One decision per dispatch (409
        afterwards). A quantity above what was dispatched is a 400 naming the line; a conflicting state is a 409.
