    Dispatch:
      type: object
      description: A dispatch with its lines. Cost is never shown.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reference:
          type: string
          description: DSP-000004 style.
        kind:
          type: string
          enum:
          - warehouse_dispatch
        origin:
          $ref: '#/components/schemas/BranchRef'
        destination:
          $ref: '#/components/schemas/BranchRef'
        status:
          $ref: '#/components/schemas/DispatchStatus'
        dispatched_by:
          $ref: '#/components/schemas/UserRef'
        dispatched_at:
          $ref: '#/components/schemas/Timestamp'
        decided_by:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        decided_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        decision_note:
          oneOf:
          - type: string
          - type: 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DispatchLine'
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionId'
          description: For example dispatch.receive when the caller may record the decision now.
      required:
      - id
      - reference
      - kind
      - origin
      - destination
      - status
      - dispatched_by
      - dispatched_at
      - decided_by
      - decided_at
      - decision_note
      - lines
      - allowed_actions
    DispatchSummary:
      type: object
      description: List row; open the dispatch for lines.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reference:
          type: string
        origin:
          $ref: '#/components/schemas/BranchRef'
        destination:
          $ref: '#/components/schemas/BranchRef'
        status:
          $ref: '#/components/schemas/DispatchStatus'
        dispatched_at:
          $ref: '#/components/schemas/Timestamp'
        line_count:
          type: integer
          minimum: 0
        has_open_discrepancy:
          type: boolean
      required:
      - id
      - reference
      - origin
      - destination
      - status
      - dispatched_at
      - line_count
      - has_open_discrepancy
