    BranchUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          type: string
          maxLength: 200
        contact:
          type: string
          maxLength: 100
      additionalProperties: false
    BranchStatusChange:
      type: object
