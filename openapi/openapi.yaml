      x-action-id:
      - dispatch.receive
      x-roles:
      - super_admin
      - branch_admin
      - front_staff
      x-conditions:
        dispatch.receive:
          super_admin:
          - destination_is_active_branch
          - not_self
          branch_admin:
          - destination_is_active_branch
          - not_self
          front_staff:
          - destination_is_active_branch
          - perm:receive_stock
          - not_self
      parameters:
      - $ref: '#/components/parameters/DispatchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
