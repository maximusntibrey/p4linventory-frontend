      - deactivated_at
      - created_at
      - allowed_actions
    UserCreate:
      type: object
      description: Creates a user. permanent_branch is required for warehouse_admin (the warehouse) and branch_admin,
        and must be null for super_admin and front_staff. The login ID is generated by the server and returned in
        the response; it is never sent.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: 'null'
        role:
          $ref: '#/components/schemas/RoleCode'
        permanent_branch:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - full_name
      - phone
      - role
      additionalProperties: false
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: 'null'
        permanent_branch:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      additionalProperties: false
    OneTimePassword:
      type: object
      description: Owner decision 2026-11-19 (OQ-23).
      properties:
        one_time_password:
          type: string
          description: Generated by the server and shown ONCE; it is never stored in readable form and cannot be
            fetched again. The user must change it at first login.
      required:
      - one_time_password
    UserCreated:
      allOf:
      - $ref: '#/components/schemas/User'
      - $ref: '#/components/schemas/OneTimePassword'
      description: The created user plus the one-time password (OQ-23).
    ChangePassword:
      type: object
      description: Any signed-in user changes their own password (OQ-23). Wrong current password is a 400 naming
        current_password. A successful change lifts the password_change_required block.
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
      required:
      - current_password
      - new_password
      additionalProperties: false
    UserRoleChange:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
      required:
      - role
      additionalProperties: false
    UserStatusChange:
      type: object
      description: Refused when the target is the caller (not_self_target) or when it would leave no active Super
        Admin (not_last_active_sa).
      properties:
        status:
          type: string
          enum:
          - active
          - suspended
          - deactivated
      required:
      - status
      additionalProperties: false
    PermissionGrantChange:
      type: object
      properties:
        granted:
          type: boolean
          description: true grants, false revokes. Both are audited; history is kept.
      required:
      - granted
      additionalProperties: false
    UserPage:
      allOf:
      - $ref: '#/components/schemas/PageEnvelope'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/User'
        required:
        - results
    ChoiceOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - value
      - label
    IdOption:
      type: object
      description: A managed-list choice whose value is the integer id used in item bodies.
      properties:
        value:
          $ref: '#/components/schemas/Id'
        label:
          type: string
      required:
      - value
      - label
    FieldDefinition:
      type: object
      properties:
        key:
          type: string
          description: Property name in the item body (core fields) or inside specs.
        label:
          type: string
        help_text:
          type: string
        type:
          type: string
          enum:
          - text
          - integer
          - decimal
          - boolean
          - choice
        required:
          type: boolean
        group:
          type: string
          description: Collapsible section the field belongs to.
        target:
          type: string
          enum:
          - item
          - specs
          description: 'item: a top-level item field; specs: a key of the specs object.'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        min:
          type: string
        max:
          type: string
        max_length:
          type: integer
        unit:
          type: string
      required:
      - key
      - label
      - type
      - required
      - group
      - target
    ItemFieldDefinitions:
      type: object
      description: What the item form shows for one category. Served by the API so the frontend hard-codes no item
        fields (OVR s3).
      properties:
        category:
          $ref: '#/components/schemas/Category'
        groups:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/FieldDefinition'
            required:
            - key
            - label
            - fields
          description: Fields grouped into the form's collapsible sections.
        brands:
          type: array
          items:
            $ref: '#/components/schemas/IdOption'
          description: Managed brand list (value is the brand id, the same integer ItemCreate.brand takes).
        subtypes:
          type: array
          items:
            $ref: '#/components/schemas/IdOption'
          description: Managed sub-types of this category (value is the sub-type id).
      required:
      - category
      - groups
      - brands
      - subtypes
    Item:
