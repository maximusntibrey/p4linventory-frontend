              - type: 'null'
          required:
          - all_locations
          - location
        stock_by_location:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
          description: 'Super Admin: every location (or the one in the location filter). Warehouse Admin: the warehouse.
            Branch Admin: the own branch. No cost or value.'
        in_transit:
          type: object
          properties:
            quantity:
              allOf:
              - $ref: '#/components/schemas/Quantity'
              description: Total open in-transit quantity; includes quantity Under investigation (OQ-18).
            under_investigation_quantity:
              $ref: '#/components/schemas/Quantity'
            open_dispatch_count:
              type: integer
              minimum: 0
            awaiting_decision_count:
              type: integer
              minimum: 0
              description: Dispatches waiting for a receiving decision.
          required:
          - quantity
          - under_investigation_quantity
          - open_dispatch_count
          - awaiting_decision_count
        low_stock:
          type: object
          properties:
            count:
              type: integer
              minimum: 0
            items:
              type: array
              items:
                $ref: '#/components/schemas/LowStockRow'
              maxItems: 10
          required:
          - count
          - items
        generated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - scope
      - stock_by_location
      - in_transit
      - low_stock
      - generated_at
    AuditAction:
      type: string
      description: 'Audit action code, an OPEN string: new codes may appear without a contract change, so clients
        must tolerate unknown values. The codes known for Sprints 1-2 are listed in x-known-values (ERD s3.9 gives
        examples only; BE s9 lists the event kinds).'
      x-known-values:
      - auth.login
      - auth.login_failed
      - auth.logout
      - branch.switched
      - branch.created
      - branch.updated
      - branch.status_changed
      - user.created
      - user.updated
      - user.role_assigned
      - user.status_changed
      - user.password_reset
      - user.permission_granted
      - user.permission_revoked
      - item.created
      - item.updated
      - item.activated
      - item.discontinued
      - item.image_uploaded
      - price.changed
      - grn.confirmed
      - dispatch.created
      - dispatch.received
      - discrepancy.flagged
      - discrepancy.resolved
      - sale.completed
      - sale.cancelled
      - import.committed
    ActivityEvent:
      type: object
      description: One audit event. Cost keys inside previous_value and new_value are removed for branch_admin (never
        serialised for Branch Admin or Front Staff).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        role_used:
          oneOf:
          - $ref: '#/components/schemas/RoleCode'
          - type: 'null'
        branch:
          oneOf:
          - $ref: '#/components/schemas/BranchRef'
          - type: 'null'
        action:
          $ref: '#/components/schemas/AuditAction'
        reference_type:
          oneOf:
          - type: string
          - type: 'null'
        reference_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        previous_value:
          oneOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        new_value:
          oneOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        self_approved:
          type: boolean
        ip_address:
          oneOf:
          - type: string
            description: IPv4 or IPv6 address.
          - type: 'null'
          x-visible-to:
          - super_admin
        user_agent:
          type: string
          x-visible-to:
          - super_admin
      required:
      - id
      - occurred_at
      - actor
      - role_used
      - branch
      - action
      - reference_type
      - reference_id
      - previous_value
      - new_value
      - self_approved
    ActivityEventPage:
      allOf:
      - $ref: '#/components/schemas/PageEnvelope'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ActivityEvent'
        required:
        - results
    ImportUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: CSV, UTF-8. Columns follow the downloadable template of the category (BE s3.11:211); the
            exact list is decided in B6.4. Every opening-balance row requires unit_cost (feeds the average cost,
            ERD E7; OQ-23) and may carry an optional reorder_level.
      required:
      - file
    ImportRowError:
      type: object
      properties:
        row:
          type: integer
          description: CSV row number (the header is row 1).
          minimum: 2
        field:
          oneOf:
          - type: string
            description: Column name.
          - type: 'null'
        message:
          type: string
          description: Plain message.
      required:
      - row
      - field
      - message
    ImportPreviewRow:
      type: object
      description: One parsed row as it would be imported (columns beyond these are decided in B6.4).
      properties:
        row:
          type: integer
          description: CSV row number (the header is row 1).
          minimum: 2
        sku:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        location_code:
          type: string
          description: Public code of the location receiving the opening quantity.
        opening_quantity:
          $ref: '#/components/schemas/Quantity'
        reorder_level:
          oneOf:
          - $ref: '#/components/schemas/Quantity'
          - type: 'null'
        unit_cost:
          $ref: '#/components/schemas/Money'
          description: Cost per unit of the opening stock; required in the file; feeds the average cost (ERD E7).
            The import is open to Super Admin and Warehouse Admin only, and cost is never shown to any other role.
          x-visible-to:
          - super_admin
          - warehouse_admin
      required:
      - row
      - sku
      - name
      - category
      - location_code
      - opening_quantity
      - reorder_level
      - unit_cost
    ImportReport:
      type: object
      description: Dry-run result. Nothing is written.
      properties:
        file_hash:
          type: string
          description: SHA-256 of the file.
        row_count:
          type: integer
          minimum: 0
        valid_row_count:
          type: integer
          minimum: 0
        error_count:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowError'
        preview:
          type: array
          items:
            $ref: '#/components/schemas/ImportPreviewRow'
          maxItems: 20
          description: The first rows as they would be imported.
        can_commit:
          type: boolean
          description: True only when error_count is 0.
      required:
      - file_hash
      - row_count
      - valid_row_count
      - error_count
      - errors
      - preview
      - can_commit
    ImportResult:
      type: object
      description: Commit result. Opening balances are written only as ledger movements (reason opening_balance).
      properties:
        reference:
          type: string
          description: IMP-000003 style.
        row_count:
          type: integer
          minimum: 0
        items_created:
          type: integer
          minimum: 0
        balances_written:
          type: integer
          minimum: 0
      required:
      - reference
      - row_count
      - items_created
      - balances_written
