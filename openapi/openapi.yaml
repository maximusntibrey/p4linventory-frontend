        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        subtype:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
          required:
          - id
          - name
        brand:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
